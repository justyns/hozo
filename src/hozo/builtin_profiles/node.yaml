name: node
description: >-
  npm cache writable + npm registry on the proxy allowlist. Leaves the network mode
  unset; pair with +proxy for installs (`hozo +node +proxy -- npm install`), or run
  without +proxy for offline use.

binds:
  - source: "~/.cache/npm"
    target: /home/{user}/.npm
    mode: rw
    optional: true

proxy:
  allow_hosts:
    - registry.npmjs.org
