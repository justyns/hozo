name: base
description: >-
  Foundation layer applied to every run: the default read-only system mounts, a private
  throwaway home, the project mounted in place as the working dir, and the scrubbed
  environment. (Merged-/usr symlinks and /proc, /dev, tmpfs /tmp are host-specific, so the
  renderer still adds those.)

# No network.mode here by default, so should be none by default

process:
  # Remove all environment variables except for the allowlist below
  clear_env: true
  cwd: "{project}"

# Default $HOME to the real home path (an empty dir in the sandbox), so it works even
# when home isn't /home/<user> (e.g. /root, /Users/...). Contents aren't exposed.
home: "{home}"

env:
  set:
    PATH: /usr/bin:/bin
  allow:
    - TERM
    - COLORTERM
    - LANG
    - "LC_*"
    - TZ

binds:
  - { source: /usr, mode: ro }
  - { source: /etc/ssl, mode: ro, optional: true }
  - { source: /etc/ca-certificates, mode: ro, optional: true }
  - { source: /etc/pki, mode: ro, optional: true }
  - { source: /etc/passwd, mode: ro, optional: true }
  - { source: /etc/group, mode: ro, optional: true }
  - { source: /etc/hosts, mode: ro, optional: true }
  - { source: /etc/nsswitch.conf, mode: ro, optional: true }
  - { source: /etc/localtime, mode: ro, optional: true }
  - { source: /etc/resolv.conf, mode: ro, optional: true }

special:
  proc: true
  dev: true

tmpfs:
  - /tmp

# Syscalls with a history of kernel privilege-escalation bugs. Linux only; ignored under
# Seatbelt.
#
# Left out on purpose: unshare and clone, which nested sandboxing needs, and ptrace and
# process_vm_readv, which `hozo audit` needs to run strace.
syscalls:
  action: errno
  deny:
    - io_uring_setup
    - io_uring_enter
    - io_uring_register
    - bpf
    - userfaultfd
    - perf_event_open
    - keyctl
    - add_key
    - request_key
    - open_by_handle_at
    - kexec_load
    - kexec_file_load
    - init_module
    - finit_module
    - delete_module
