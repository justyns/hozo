name: base
description: Linux foundation layer applied to every run.

process:
  clear_env: true
  cwd: "{project}"

# Real home path, mounted as an empty dir.
home: "{home}"

env:
  set:
    PATH: /usr/bin:/bin
  allow:
    - TERM
    - COLORTERM
    - LANG
    - "LC_*"
    - TZ

binds:
  - { source: /usr, mode: ro }
  - { source: /etc/ssl, mode: ro, optional: true }
  - { source: /etc/ca-certificates, mode: ro, optional: true }
  - { source: /etc/pki, mode: ro, optional: true }
  - { source: /etc/passwd, mode: ro, optional: true }
  - { source: /etc/group, mode: ro, optional: true }
  - { source: /etc/hosts, mode: ro, optional: true }
  - { source: /etc/nsswitch.conf, mode: ro, optional: true }
  - { source: /etc/localtime, mode: ro, optional: true }
  - { source: /etc/resolv.conf, mode: ro, optional: true }

special:
  proc: true
  dev: true

tmpfs:
  - /tmp

# Syscalls with a history of kernel privilege-escalation bugs. Linux only.
# unshare, clone, ptrace and process_vm_readv stay allowed for nested sandboxes and `hozo audit`.
syscalls:
  deny:
    - io_uring_setup
    - io_uring_enter
    - io_uring_register
    - bpf
    - userfaultfd
    - perf_event_open
    - keyctl
    - add_key
    - request_key
    - open_by_handle_at
    - kexec_load
    - kexec_file_load
    - init_module
    - finit_module
    - delete_module
