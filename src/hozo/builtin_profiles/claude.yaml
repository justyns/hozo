name: claude
description: Run the host's Claude Code with its login, sessions and memory, with egress limited to Anthropic.

network:
  mode: proxy

env:
  set:
    # Defaults to /tmp/claude-$UID, which Seatbelt denies.
    CLAUDE_CODE_TMPDIR: "{scratch}"
  prepend_path:
    - "{home}/.local/bin"

binds:
  # The native installer symlinks ~/.local/bin/claude into ~/.local/share/claude/versions/, so bind both.
  - { source: "{home}/.local/bin", mode: ro, optional: true }
  - { source: "{home}/.local/share/claude", mode: ro, optional: true }
  - { source: "{home}/.claude", mode: rw, optional: true }
  - { source: "{home}/.claude.json", mode: rw, optional: true }

proxy:
  allow_hosts:
    - api.anthropic.com
    - statsig.anthropic.com
    # OAuth, for /login and token refresh.
    - platform.claude.com
