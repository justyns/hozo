name: base-macos
description: macOS foundation layer applied to every run in place of `base`.
# The Seatbelt renderer grants system paths and mach services.

process:
  clear_env: true
  cwd: "{project}"

# Real home path. Only subpaths another profile binds are reachable.
home: "{home}"

env:
  set:
    PATH: /usr/bin:/bin:/usr/sbin:/sbin
  allow:
    - TERM
    - COLORTERM
    - LANG
    - "LC_*"
    - TZ
