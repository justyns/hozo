name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 0  # full history + tags for dynamic versioning

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check src tests

      - name: Black (format check)
        run: uv run black --check src tests

      - name: Tests
        # bwrap isn't installed on the runner, so the integration tests self-skip;
        # the unit tests (policy, env, profiles, argv rendering, proxy, ...) run.
        run: uv run pytest
